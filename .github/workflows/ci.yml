name: Verify RuralConnect
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ruralconnect
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: ruralconnect_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ruralconnect -d ruralconnect_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://ruralconnect:disposable-ci-only@localhost:5432/ruralconnect_test
      NODE_ENV: test
      OTP_MODE: sandbox
      RUN_DB_TESTS: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm test && pnpm --filter @ruralconnect/api test:integration
      - run: pnpm contracts:generate && git diff --exit-code packages/api-contracts
      - run: pnpm typecheck && pnpm build
      - run: pnpm audit --prod --audit-level high
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Analyze and test shared mobile workflows
        working-directory: packages/mobile_core
        run: flutter pub get --enforce-lockfile && flutter analyze && flutter test
      - name: Analyze, test and build independent Android apps
        shell: bash
        run: |
          for app in passenger driver bus; do
            cd "$GITHUB_WORKSPACE/apps/$app"
            flutter pub get --enforce-lockfile
            flutter analyze
            flutter test
            flutter build apk --debug
          done
      - name: Verify signed release bundles with disposable CI credentials
        shell: bash
        run: |
          set -euo pipefail
          export RC_KEYSTORE_PATH="$RUNNER_TEMP/ci-release.jks"
          export RC_KEYSTORE_PASSWORD="disposable-ci-signing-only"
          export RC_KEY_ALIAS="ci-test"
          export RC_KEY_PASSWORD="$RC_KEYSTORE_PASSWORD"
          keytool -genkeypair -keystore "$RC_KEYSTORE_PATH" -storepass "$RC_KEYSTORE_PASSWORD" -keypass "$RC_KEY_PASSWORD" -alias "$RC_KEY_ALIAS" -dname "CN=Disposable CI, O=RuralConnect Test" -keyalg RSA -keysize 2048 -validity 2 -noprompt
          for app in passenger driver bus; do
            cd "$GITHUB_WORKSPACE/apps/$app"
            flutter build appbundle --release --dart-define=API_URL=https://api.example.invalid/v1
          done
          rm -f "$RC_KEYSTORE_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: ruralconnect-development-apks
          path: apps/*/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
