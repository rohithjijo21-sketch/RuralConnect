name: Verify RuralConnect
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ruralconnect
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: ruralconnect_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ruralconnect -d ruralconnect_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://ruralconnect:disposable-ci-only@localhost:5432/ruralconnect_test
      NODE_ENV: test
      OTP_MODE: sandbox
      RUN_DB_TESTS: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm test && pnpm --filter @ruralconnect/api test:integration
      - run: pnpm contracts:generate && git diff --exit-code packages/api-contracts
      - run: pnpm typecheck && pnpm build
      - run: pnpm audit --prod --audit-level high
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native targets without replacing authored entry points
        shell: bash
        run: |
          for app in passenger driver bus; do
            cd "$GITHUB_WORKSPACE/apps/$app"
            cp lib/main.dart "$RUNNER_TEMP/$app-main.dart"
            flutter create --platforms android,ios --org in.ruralconnect --project-name "ruralconnect_$app" --no-pub .
            cp "$RUNNER_TEMP/$app-main.dart" lib/main.dart
            rm -f test/widget_test.dart
            flutter pub get
            flutter analyze
            flutter test
          done
