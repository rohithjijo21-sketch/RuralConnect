name: Publish Android development APKs
on:
  push:
    tags: ['android-dev-v*']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Find successful build for tagged commit
        id: build
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.workflow_runs[0].id // empty')
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "VERSION=${GITHUB_REF_NAME#android-dev-v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: ruralconnect-development-apks
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Prepare three separately named APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for app in passenger driver bus; do
            mapfile -t matches < <(find downloaded -type f -path "*/$app/*/app-debug.apk")
            test "${#matches[@]}" -eq 1
            test -s "${matches[0]}"
            cp "${matches[0]}" "release-assets/RuralConnect-$app-$VERSION-dev.apk"
          done
          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish development prerelease
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.apk release-assets/SHA256SUMS.txt --title "RuralConnect Android $VERSION — Development testing" --notes-file docs/operations/android-prerelease.md --prerelease --target "$GITHUB_SHA"
